<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Lost in the graph? | ScopeGraph</title>
<style>
  :root{--ink:#151923;--white:#F7F8F5;--lime:#C7F36B;--blue:#526BEE;--gray:#8B929E;--border:#E4E7E1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--white);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:32px}
  .card{max-width:760px;width:100%;text-align:center}
  .card img{width:100%;max-width:640px;height:auto}
  h1{font-size:40px;letter-spacing:-.5px;margin:16px 0 8px}
  p{color:var(--gray);font-size:17px;margin:0 0 24px}
  a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700}
  a:hover{background:var(--blue)}
  .logo{height:28px;vertical-align:middle}
</style>
</head>
<body>
<main class="card">
  <img src="illustrations/scopegraph-404-illustration.svg" alt="Scout investigating a broken graph path">
  <h1>Lost in the graph?</h1>
  <p>This path doesn’t lead anywhere. Let’s find your way back.</p>
  <a href="/">Back to dashboard →</a>
</main>
</body>
</html>
