<template><style>

    font-size:31px;line-height:1.18;font-weight:700;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
    </style><div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div data-hf-id="hf-xzb9" id="caption-01" class="clip" data-start="0.45" data-duration="3.86" data-track-index="91" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-pub8" class="caption-text">A small code change can reach far beyond one file.</div></div><div data-hf-id="hf-m5vq" id="caption-02" class="clip" data-start="4.31" data-duration="6.18" data-track-index="92" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-fkkn" class="caption-text">A route calls a service. A service touches a model. Tests may need a new contract.</div></div><div data-hf-id="hf-vcfi" id="caption-03" class="clip" data-start="10.49" data-duration="3.86" data-track-index="93" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-11je" class="caption-text">Before editing, you need a map of what might move.</div></div><div data-hf-id="hf-mqyw" id="caption-04" class="clip" data-start="15.45" data-duration="5.25" data-track-index="94" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-hou2" class="caption-text">ScopeGraph turns a change request into a reviewable impact plan.</div></div><div data-hf-id="hf-iniq" id="caption-05" class="clip" data-start="20.7" data-duration="8.4" data-track-index="95" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-puyi" class="caption-text">It connects the request to an indexed repository and shows why each cited source location matters.</div></div><div data-hf-id="hf-o5oh" id="caption-06" class="clip" data-start="29.1" data-duration="5.25" data-track-index="96" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-o8j7" class="caption-text">The developer remains responsible for deciding which edits are needed.</div></div><div data-hf-id="hf-j9l5" id="caption-07" class="clip" data-start="35.45" data-duration="4.52" data-track-index="97" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-2a66" class="caption-text">Here is the bundled, public authentication sample.</div></div><div data-hf-id="hf-egur" id="caption-08" class="clip" data-start="39.97" data-duration="8.4" data-track-index="98" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-m11k" class="caption-text">ScopeGraph scans Python files, extracts symbols and relationships, and builds a dependency graph.</div></div><div data-hf-id="hf-uw0v" id="caption-09" class="clip" data-start="48.37" data-duration="10.98" data-track-index="99" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-v5sz" class="caption-text">You can move from an API route to related services, models and tests before making a change.</div></div><div data-hf-id="hf-d1v0" id="caption-10" class="clip" data-start="60.45" data-duration="7.82" data-track-index="100" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-u3va" class="caption-text">Our request is to verify a new email address before changing a user&#x27;s active email.</div></div><div data-hf-id="hf-3euo" id="caption-11" class="clip" data-start="68.27" data-duration="6.78" data-track-index="101" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-4i1v" class="caption-text">This recorded report uses ScopeGraph&#x27;s deterministic offline provider, not a live model call.</div></div><div data-hf-id="hf-trbj" id="caption-12" class="clip" data-start="75.05" data-duration="5.74" data-track-index="102" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-xr35" class="caption-text">The report separates proposed direct edits, downstream concerns and potential risks.</div></div><div data-hf-id="hf-cmor" id="caption-13" class="clip" data-start="80.79" data-duration="13.56" data-track-index="103" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-yztn" class="caption-text">Opening an item reveals a real indexed path and numbered source lines. That verifies the reference exists; it does not prove every suggested edit is necessary.</div></div><div data-hf-id="hf-hmd0" id="caption-14" class="clip" data-start="95.45" data-duration="4.72" data-track-index="104" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-y7vm" class="caption-text">You can also attach a screenshot to explain the visible interface.</div></div><div data-hf-id="hf-a5rf" id="caption-15" class="clip" data-start="100.17" data-duration="6.02" data-track-index="105" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-pnpi" class="caption-text">A separately authorized Meta Muse Spark vision smoke test recognized this synthetic email-settings screen.</div></div><div data-hf-id="hf-w2m0" id="caption-16" class="clip" data-start="106.19" data-duration="8.16" data-track-index="106" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-liyr" class="caption-text">It did not run the full live impact pipeline. Visual observations alone cannot identify the exact files to edit.</div></div><div data-hf-id="hf-1c6v" id="caption-17" class="clip" data-start="115.45" data-duration="5.71" data-track-index="107" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-76lm" class="caption-text">An experimental UI Proposal workspace turns a description into an inert before-and-after preview.</div></div><div data-hf-id="hf-09kj" id="caption-18" class="clip" data-start="121.16" data-duration="5.72" data-track-index="108" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-6yq0" class="caption-text">The current local example uses an offline, deterministic generator and is labeled conceptual.</div></div><div data-hf-id="hf-6coh" id="caption-19" class="clip" data-start="126.88" data-duration="7.47" data-track-index="109" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-udx9" class="caption-text">Developers can refine the proposal and separately request source-backed impact analysis; the preview never edits repository code.</div></div><div data-hf-id="hf-wbwh" id="caption-20" class="clip" data-start="135.45" data-duration="6.21" data-track-index="110" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-vqow" class="caption-text">In the configured Meta path, Muse Spark interprets requirements and proposes impact relationships.</div></div><div data-hf-id="hf-hs6i" id="caption-21" class="clip" data-start="141.66" data-duration="9.09" data-track-index="111" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-mier" class="caption-text">Local retrieval, graph traversal and an evidence gate check those claims against indexed code before the brief is shown.</div></div><div data-hf-id="hf-tjic" id="caption-22" class="clip" data-start="150.75" data-duration="8.6" data-track-index="112" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-q8uw" class="caption-text">MCP tools expose grounded context to coding agents. Optional partner routing exists, but its live behavior remains unverified.</div></div><div data-hf-id="hf-7upy" id="caption-23" class="clip" data-start="160.45" data-duration="6.13" data-track-index="113" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-17g4" class="caption-text">ScopeGraph is a planning aid, not an automatic proof of every dependency.</div></div><div data-hf-id="hf-x1zs" id="caption-24" class="clip" data-start="166.58" data-duration="8.17" data-track-index="114" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-ase3" class="caption-text">It gives developers a traceable starting point, with uncertainty visible and source evidence close at hand.</div></div><div data-hf-id="hf-28h6" id="caption-25" class="clip" data-start="174.75" data-duration="4.6" data-track-index="115" style="left:165px;top:924px;width:1590px;min-height:95px"><div data-hf-id="hf-xkkr" class="caption-text">ScopeGraph. Understand the impact before you change the code.</div></div></div><script>window.__timelines=window.__timelines||{};
