services:
  postgres:
    image: postgres:16-alpine
    container_name: scopegraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scopegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scopegraph_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-scopegraph_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scopegraph} -d ${POSTGRES_DB:-scopegraph_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scopegraph_network

  redis:
    image: redis:7-alpine
    container_name: scopegraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scopegraph_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scopegraph-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-scopegraph}:${POSTGRES_PASSWORD:-scopegraph_dev_secret}@postgres:5432/${POSTGRES_DB:-scopegraph_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - WORKSPACE_DIR=/app/data/workspaces
      - META_AI_PROVIDER=${META_AI_PROVIDER:-offline_demo}
      - META_AI_API_KEY=${META_AI_API_KEY:-}
      - META_AI_BASE_URL=${META_AI_BASE_URL:-https://api.meta.ai/v1}
      - META_AI_MODEL=${META_AI_MODEL:-muse-spark-1.3}
      - META_AI_TEMPERATURE=${META_AI_TEMPERATURE:-0.1}
      - META_AI_MAX_TOKENS=${META_AI_MAX_TOKENS:-6000}
      - AI_RETRIEVAL_TOP_K=${AI_RETRIEVAL_TOP_K:-8}
      - AI_CONTEXT_TOKEN_BUDGET=${AI_CONTEXT_TOKEN_BUDGET:-3000}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/callback/github}
    ports:
      - "8000:8000"
    volumes:
      - workspace_data:/app/data/workspaces
      - ./services/api/app:/app/app
      - ./examples:/app/examples
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - scopegraph_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.github.com:20.205.243.168"
      - "github.com:20.205.243.166"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scopegraph-worker
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.github.com:20.205.243.168"
      - "github.com:20.205.243.166"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-scopegraph}:${POSTGRES_PASSWORD:-scopegraph_dev_secret}@postgres:5432/${POSTGRES_DB:-scopegraph_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - WORKSPACE_DIR=/app/data/workspaces
      - META_AI_PROVIDER=${META_AI_PROVIDER:-offline_demo}
      - META_AI_API_KEY=${META_AI_API_KEY:-}
      - META_AI_BASE_URL=${META_AI_BASE_URL:-https://api.meta.ai/v1}
      - META_AI_MODEL=${META_AI_MODEL:-muse-spark-1.3}
      - META_AI_TEMPERATURE=${META_AI_TEMPERATURE:-0.1}
      - META_AI_MAX_TOKENS=${META_AI_MAX_TOKENS:-6000}
      - AI_RETRIEVAL_TOP_K=${AI_RETRIEVAL_TOP_K:-8}
      - AI_CONTEXT_TOKEN_BUDGET=${AI_CONTEXT_TOKEN_BUDGET:-3000}
    volumes:
      - workspace_data:/app/data/workspaces
      - ./services/api/app:/app/app
      - ./examples:/app/examples
      - ./.env:/app/.env:ro
    networks:
      - scopegraph_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: scopegraph-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scopegraph_network

volumes:
  postgres_data:
  redis_data:
  workspace_data:

networks:
  scopegraph_network:
    driver: bridge
